# GoReleaser configuration for fuse (docket change 0082).
#
# Tag-driven releases: `git push origin vX.Y.Z` runs .github/workflows/release.yml,
# which runs this config. Everything below is also exercised on every PR by the
# `release-dry-run` job in integration.yml (`goreleaser check` +
# `goreleaser release --snapshot --clean --skip=publish`).
#
# ARCHIVE-LAYOUT INVARIANT (asserted by release-dry-run): every archive has `fuse`
# at its root, which is where scripts/install.sh looks for it.
version: 2

project_name: fuse

builds:
  - id: fuse
    main: ./cmd/fuse
    binary: fuse
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # The package path MUST stay identical to the Makefile's VERSION_PKG
    # (github.com/ethanhinson/fuse/internal/version) — a drifting path injects
    # nothing and `fuse version` silently reports "dev".
    ldflags:
      - -s -w -X github.com/ethanhinson/fuse/internal/version.Version={{ .Version }}

archives:
  - id: fuse
    # `ids` (not the `builds` spelling the plan's task text used): `archives.builds`
    # is DEPRECATED in v2 and makes `goreleaser check` exit non-zero, which would
    # fail the release-dry-run CI job. `ids` is the v2 name for the same field.
    ids:
      - fuse
    name_template: fuse_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Declared, not inherited: `tar.gz` is GoReleaser's implicit default, but six
    # consumers hardcode the extension — scripts/install.sh and
    # scripts/install_test.sh build `fuse_<ver>_<os>_<arch>.tar.gz` download
    # names, integration.yml globs `dist/fuse_*_darwin_arm64.tar.gz` for the
    # archive-layout assertion, release.yml attests `dist/*.tar.gz`, and
    # README.md + docs/releasing.md print `tar -xzf` commands. An upstream
    # default change (or a `format_overrides` added later for a Windows build)
    # would break the download URL, the layout glob, and the attestation subject
    # at once, and the layout job would only report "found 0" without naming the
    # cause. `formats` (plural) is the v2 spelling: singular `format` is
    # DEPRECATED and makes `goreleaser check` exit non-zero, failing
    # release-dry-run.
    formats: [tar.gz]
    # `fuse` sits at the archive root, where scripts/install.sh expects it.
    strip_binary_directory: true
    files:
      - README.md
      # MIT license text, shipped in every archive. Declared as a glob so a
      # rename (LICENSE.md, LICENSE.txt) still matches.
      - LICENSE*

checksum:
  name_template: fuse_{{ .Version }}_checksums.txt
  algorithm: sha256

release:
  github:
    owner: ethanhinson
    name: fuse
  draft: false
  # A tag containing a pre-release segment (v0.2.0-rc.1) publishes as a GitHub
  # pre-release; a plain vX.Y.Z publishes as a full release.
  prerelease: auto

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^chore'
      - '^test'
      - '^docket'

# A software bill of materials beside each archive. Needs syft on PATH, which both
# workflows install.
sboms:
  - artifacts: archive
