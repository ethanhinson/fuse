apiVersion: v2
name: fuse
description: |
  fuse loop-serve-net — a networked, multi-tenant agent-loop server. Connect
  over h2c (ADR-0033), bearer-token auth at the edge (ADR-0034), and a durable
  Postgres event store so a client reattaches to its loop after a redeploy on a
  different replica (ADR-0031).
type: application

