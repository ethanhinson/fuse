{{- include "fuse.guards" . -}}
{{- if not .Values.config.existingSecret }}
# ============================================================================
# The trusted home file (ADR-0006), mounted at /home/nonroot/.fuse/config.yml.
#
# A Secret and not a ConfigMap because loop_server.auth lives in it:
# loop_server.auth, observability, and tool_identity are honored from this file
# and NOWHERE else, which is precisely why it is the credential surface.
#
# A Kubernetes Secret is base64, not encryption. Anyone with get-secrets in this
# namespace can read every bearer token below. For a real deployment set
# config.existingSecret and have your secrets manager produce it — the chart then
# renders nothing here and never sees the tokens.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fuse.configSecretName" . }}
  labels:
    {{- include "fuse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.key }}: |
    {{- if .Values.auth.tokens }}
    # loop_server.auth is rendered from values auth.tokens.
    {{- else if .Values.auth.allowDevToken }}
    # =====================================================================
    # NO loop_server.auth — auth.allowDevToken=true.
    #
    # The server will SYNTHESIZE its built-in dev token and log it loudly at
    # startup (ADR-0034), which means the token is in your log aggregator and
    # in this repository. Every client that knows it acts as the _default
    # tenant. This is for a throwaway cluster and nothing else.
    # =====================================================================
    {{- end }}
    {{- include "fuse.configYaml" . | nindent 4 }}
{{- end }}
