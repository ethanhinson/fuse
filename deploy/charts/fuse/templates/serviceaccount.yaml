{{- include "fuse.guards" . -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fuse.serviceAccountName" . }}
  labels:
    {{- include "fuse.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server calls no Kubernetes API in this change — sandbox.mode=kubernetes,
# the only mode that would, is not yet available (change #75) — so no token is
# projected into the pod. #75 will need to widen this, deliberately, alongside
# the RBAC it ships.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
