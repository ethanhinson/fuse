{{- include "fuse.guards" . -}}
{{- if and .Values.postgres.dsn (not .Values.postgres.existingSecret) }}
# The inline DSN from values, as a chart-owned Secret injected into the pod as
# FUSE_PG_DSN (secretKeyRef — never a plain env value, which would show in
# `kubectl describe pod` and in every Deployment dump).
#
# It still came from a values file, so the password is wherever that file is.
# postgres.existingSecret is the production shape.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-dsn" (include "fuse.fullname" .) }}
  labels:
    {{- include "fuse.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.postgres.dsn | quote }}
{{- else if and .Values.postgres.dsn .Values.postgres.existingSecret }}
{{- fail "fuse: set only one of postgres.dsn or postgres.existingSecret. With both, the chart would render a Secret nothing reads while the pod used the other — a password checked into a values file and no indication it is inert." }}
{{- end }}
