# Development-only reference stack. Do not use this Compose file as a production deployment.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["9091:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otelcol/config.yml"]
    ports: ["4317:4317", "4318:4318"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    ports: ["3200:3200"]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
  grafana:
    image: grafana/grafana:12.0.2
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
