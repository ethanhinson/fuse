server:
  http_listen_port: 3200
stream_over_http_enabled: true
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
compactor:
  compaction:
    block_retention: 24h
storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
# TraceQL metrics (rate/duration panels in Grafana Traces Drilldown) are served
# by the local-blocks processor; without it those queries return errors.
metrics_generator:
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true
  storage:
    path: /tmp/tempo/generator/wal
    remote_write_flush_deadline: 1m
  traces_storage:
    path: /tmp/tempo/generator/traces
overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks]
