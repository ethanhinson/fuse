name: Integration

on: [push, pull_request]

jobs:
  # Race-detector unit suite. Subagents run concurrently (scheduler, spawn tree), so the full unit
  # suite must run under -race on every push/PR. This is deliberately Docker-free
  # and fast, separate from the heavier MCP integration job below.
  unit-race:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests with race detector
        run: go test -race ./...

  # Keeps the RELEASE CONFIG honest on every PR (change 0082). A .goreleaser.yaml
  # edit that breaks the release is otherwise discovered at tag
  # time, when the only way out is a yanked release and a re-tag. So the whole
  # config is parsed and a full snapshot release is built here, on every push
  # and PR, and the archive-layout invariant is ASSERTED rather than assumed.
  #
  # Nothing here publishes anything.
  #
  # This job HARD-FAILS when a tool or artifact is missing — it never
  # green-skips. Per the `smoke-over-fake-backend-proves-wire-not-system`
  # learning, a silent skip lets a green suite hide an unexercised path, which
  # is precisely the failure mode this job exists to prevent.
  release-dry-run:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 — GoReleaser derives the version from git tags and
      # refuses to run against a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          install-only: true

      # `goreleaser check` exits NON-ZERO on any deprecated key, so this doubles
      # as a deprecation gate. When it fails, fix the config forward to the v2
      # spelling — never re-introduce the deprecated key to quiet it.
      - name: Validate .goreleaser.yaml
        run: goreleaser check

      - name: Build a snapshot release
        run: goreleaser release --snapshot --clean --skip=publish

      # THE ARCHIVE-LAYOUT INVARIANT (documented at the top of .goreleaser.yaml).
      - name: Assert the archive-layout invariant
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/fuse_*_darwin_arm64.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 darwin/arm64 archive in dist/, found ${#archives[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi
          archive="${archives[0]}"
          echo "asserting layout of ${archive}"
          # Members are listed once and reused: re-running `tar tzf` per binary
          # would let a truncated archive pass one check and fail the next for
          # the wrong reason.
          members="$(tar tzf "${archive}")"
          echo "${members}"
          status=0
          for want in fuse; do
            # Anchored: `fuse` must be the archive-root entry, not a nested path.
            if printf '%s\n' "${members}" | grep -qxF "${want}"; then
              echo "  ok: ${want}"
            else
              echo "::error::${archive} is missing the archive-root entry '${want}' — see the ARCHIVE-LAYOUT INVARIANT in .goreleaser.yaml" >&2
              status=1
            fi
          done
          exit "${status}"

      # Drive the real installer against the snapshot tree over
      # FUSE_RELEASE_BASE_URL. The test takes the dist dir as $1 and recovers the
      # generated snapshot version from the single fuse_*_checksums.txt, so no
      # version string has to be threaded through this workflow. It installs into
      # its own temp dirs and never touches the runner's $HOME/.local/bin.
      - name: Exercise scripts/install.sh against the snapshot dist/
        run: scripts/install_test.sh "${GITHUB_WORKSPACE}/dist"

  mcp-integration:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Playwright browsers
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium

      - name: Start MCP services
        run: docker compose -f internal/mcp/testdata/docker-compose.yml up -d

      - name: Wait for services
        run: |
          set -e
          wait_for() {
            local url="$1"
            for i in $(seq 1 90); do
              # --max-time 3: prevents curl from hanging on SSE/streaming
              # endpoints that never close the connection.
              # "; true" suppresses set -e on curl's timeout exit (28) while
              # preserving the HTTP status code curl writes to stdout before
              # timing out — so SSE endpoints that return 200 headers but
              # stream forever are correctly detected as ready.
              code=$(curl -s --max-time 3 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null; true)
              if [[ "${code}" -ge 200 && "${code}" -lt 500 ]] 2>/dev/null; then
                echo "ready: $url (HTTP ${code})"
                return 0
              fi
              sleep 2
            done
            echo "timed out waiting for $url" >&2
            return 1
          }
          wait_for http://localhost:8080/default/.well-known/openid-configuration
          wait_for http://localhost:3001/sse

      - name: Run integration tests
        run: go test -tags integration -v -timeout 300s ./internal/mcp/...

      - name: Service logs on failure
        if: failure()
        run: docker compose -f internal/mcp/testdata/docker-compose.yml logs

      - name: Teardown
        if: always()
        run: docker compose -f internal/mcp/testdata/docker-compose.yml down -v
