name: Integration

on: [push, pull_request]

jobs:
  # Permanent, hermetic observability proof. External Compose remains an explicit
  # operator smoke target; CI acceptance uses in-memory exporters and real HTTP
  # handlers so a green result cannot depend on a monitoring backend.
  observability-acceptance:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run hermetic observability acceptance
        run: make observability-acceptance

      - name: Run focused observability race lane
        run: make observability-race

  # Race-detector unit suite. The platform's core value is concurrent
  # multi-agent execution (scheduler, spawn tree, blackboard), so the full unit
  # suite must run under -race on every push/PR. This is deliberately Docker-free
  # and fast, separate from the heavier MCP integration job below.
  unit-race:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests with race detector
        run: go test -race ./...

  # Permanent headless-browser reconnect lane for @fuse/sdk (change 0056). Drives the REAL
  # Wander example app in headless chromium against a REAL `fuse loop-serve-net` backend
  # (scripted LLM_GATEWAY_URL double, never Claude), kills the network mid-stream, and
  # asserts transparent resume with no-loss/no-dup. It is the enforced successor to the
  # deferred manual real-browser proof at #50/#55. The lane hard-fails (never green-skips)
  # when its toolchain is absent, so a green suite can never hide an unexercised browser path.
  browser-acceptance:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # esbuild (used by examples/wander/build.sh to bundle @fuse/sdk for the browser) lives
      # in the repo npm workspace.
      - name: Install npm workspace deps
        run: npm install

      - name: Install Playwright chromium
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium

      - name: Run headless-browser reconnect lane
        run: go test -tags browser -timeout 300s ./examples/wander/...

  mcp-integration:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Playwright browsers
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium

      - name: Start MCP services
        run: docker compose -f internal/mcp/testdata/docker-compose.yml up -d

      - name: Wait for services
        run: |
          set -e
          wait_for() {
            local url="$1"
            for i in $(seq 1 90); do
              # --max-time 3: prevents curl from hanging on SSE/streaming
              # endpoints that never close the connection.
              # "; true" suppresses set -e on curl's timeout exit (28) while
              # preserving the HTTP status code curl writes to stdout before
              # timing out — so SSE endpoints that return 200 headers but
              # stream forever are correctly detected as ready.
              code=$(curl -s --max-time 3 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null; true)
              if [[ "${code}" -ge 200 && "${code}" -lt 500 ]] 2>/dev/null; then
                echo "ready: $url (HTTP ${code})"
                return 0
              fi
              sleep 2
            done
            echo "timed out waiting for $url" >&2
            return 1
          }
          wait_for http://localhost:8080/default/.well-known/openid-configuration
          wait_for http://localhost:3001/sse

      - name: Run integration tests
        run: go test -tags integration -v -timeout 300s ./internal/mcp/...

      - name: Service logs on failure
        if: failure()
        run: docker compose -f internal/mcp/testdata/docker-compose.yml logs

      - name: Teardown
        if: always()
        run: docker compose -f internal/mcp/testdata/docker-compose.yml down -v
