name: Integration

on: [push, pull_request]

jobs:
  # Permanent, hermetic observability proof. External Compose remains an explicit
  # operator smoke target; CI acceptance uses in-memory exporters and real HTTP
  # handlers so a green result cannot depend on a monitoring backend.
  observability-acceptance:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run hermetic observability acceptance
        run: make observability-acceptance

      - name: Run focused observability race lane
        run: make observability-race

  # Race-detector unit suite. The platform's core value is concurrent
  # multi-agent execution (scheduler, spawn tree, blackboard), so the full unit
  # suite must run under -race on every push/PR. This is deliberately Docker-free
  # and fast, separate from the heavier MCP integration job below.
  unit-race:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # helm is a TEST DEPENDENCY, not just a release one: deploy/charts'
      # `helm lint` + `helm template` gate skips loudly when helm is absent, and
      # a skip in CI is indistinguishable from a pass in the summary. Installing
      # it here is what makes `go test -race ./...` actually exercise the chart.
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      - name: Run unit tests with race detector
        run: go test -race ./...

  # End-to-end egress datapath proof (change 0064). Starts a REAL --network none
  # container on the runner's native-Linux Docker and asserts the full datapath:
  # a declared destination is reachable through the mounted UNIX socket + fuse
  # forwarder + host proxy, while an undeclared one is refused. This is the check
  # no unit test can reach and that Docker Desktop for macOS cannot satisfy (its
  # VM file-sharing layer does not relay a host UNIX socket bind-mount) — so it
  # is proven here, on a native-Linux daemon, rather than on a developer's Mac.
  egress-datapath:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Pre-pull the default container image
        run: docker pull alpine:3.20

      - name: Run end-to-end egress datapath proof
        run: make egress-datapath

  # Permanent headless-browser reconnect lane for @fuse/sdk (change 0056). Drives the REAL
  # Wander example app in headless chromium against a REAL `fuse loop-serve-net` backend
  # (scripted LLM_GATEWAY_URL double, never Claude), kills the network mid-stream, and
  # asserts transparent resume with no-loss/no-dup. It is the enforced successor to the
  # deferred manual real-browser proof at #50/#55. The lane hard-fails (never green-skips)
  # when its toolchain is absent, so a green suite can never hide an unexercised browser path.
  browser-acceptance:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # esbuild (used by examples/wander/build.sh to bundle @fuse/sdk for the browser) lives
      # in the repo npm workspace.
      - name: Install npm workspace deps
        run: npm install

      - name: Install Playwright chromium
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium

      - name: Run headless-browser reconnect lane
        run: go test -tags browser -timeout 300s ./examples/wander/...

  # Keeps the RELEASE CONFIG honest on every PR (change 0082). A .goreleaser.yaml
  # or Dockerfile edit that breaks the release is otherwise discovered at tag
  # time, when the only way out is a yanked release and a re-tag. So the whole
  # config is parsed and a full snapshot release is built here, on every push
  # and PR, and the archive-layout invariant is ASSERTED rather than assumed.
  #
  # `--skip=docker` keeps PR CI registry- and buildx-free; the Docker path is
  # separately proven by egress-datapath above, and the image build itself is
  # proven by the first real tag. Nothing here publishes anything.
  #
  # This job HARD-FAILS when a tool or artifact is missing — it never
  # green-skips. Per the `smoke-over-fake-backend-proves-wire-not-system`
  # learning, a silent skip lets a green suite hide an unexercised path, which
  # is precisely the failure mode this job exists to prevent.
  release-dry-run:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 — GoReleaser derives the version from git tags and
      # refuses to run against a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          install-only: true

      # Pinned to the same helm the release job uses, so a chart that renders
      # here renders there. `helm` is also what deploy/charts' Go gate shells
      # out to, and a dry run without it would prove nothing about the chart.
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      # `goreleaser check` exits NON-ZERO on any deprecated key, so this doubles
      # as a deprecation gate. When it fails, fix the config forward to the v2
      # spelling — never re-introduce the deprecated key to quiet it.
      - name: Validate .goreleaser.yaml
        run: goreleaser check

      - name: Build a snapshot release
        run: goreleaser release --snapshot --clean --skip=publish,docker

      # THE ARCHIVE-LAYOUT INVARIANT (documented at the top of .goreleaser.yaml).
      # A darwin archive must carry `fuse` AND BOTH linux forwarders at its root,
      # because cmd/fuse/sandbox.go resolves the forwarder by the SANDBOX IMAGE's
      # arch, not the host's. Dropping one turns `egress.mode: enforce` into
      # deny-all, silently. darwin/arm64 is checked because it is the case where
      # every binary in the archive is for a different platform than the archive.
      - name: Assert the archive-layout invariant
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/fuse_*_darwin_arm64.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 darwin/arm64 archive in dist/, found ${#archives[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi
          archive="${archives[0]}"
          echo "asserting layout of ${archive}"
          # Members are listed once and reused: re-running `tar tzf` per binary
          # would let a truncated archive pass one check and fail the next for
          # the wrong reason.
          members="$(tar tzf "${archive}")"
          echo "${members}"
          status=0
          for want in fuse fuse-egress-forward-linux-amd64 fuse-egress-forward-linux-arm64; do
            # Anchored: `fuse` must be the archive-root entry `fuse`, not a
            # prefix of `fuse-egress-forward-linux-amd64` or a nested path.
            if printf '%s\n' "${members}" | grep -qxF "${want}"; then
              echo "  ok: ${want}"
            else
              echo "::error::${archive} is missing the archive-root entry '${want}' — see the ARCHIVE-LAYOUT INVARIANT in .goreleaser.yaml" >&2
              status=1
            fi
          done
          exit "${status}"

      # THE DEPLOYMENT ARTIFACTS (docket change 0076), same rationale as the
      # release config above: a chart or compose file that only breaks at tag
      # time costs a yanked release, so both are rendered on every PR.
      #
      # HARD-FAIL, never green-skip — this job's documented posture. Both tools
      # are installed by steps above, so an absent one is a broken workflow and
      # must fail here rather than be tolerated.
      #
      # `--version 0.0.0-dev` mirrors Chart.yaml's in-tree placeholder: the real
      # version is stamped from the tag by release.yml and is not knowable here.
      # NOTHING in this step pushes, and no packaged chart leaves the runner.
      - name: Lint, render, and package the Helm chart
        run: |
          set -euo pipefail

          command -v helm >/dev/null || {
            echo "::error::helm is not on PATH — the setup-helm step above must have failed. This job hard-fails rather than skipping." >&2
            exit 1
          }
          helm version

          # The minimal valid values set: BOTH mandatory guards satisfied (an
          # auth surface and a DSN) and nothing else, so a new guard that fires
          # on the defaults is caught here instead of at install time.
          minimal=(
            --set 'postgres.dsn=postgres://fuse:dry-run@postgres:5432/fuse?sslmode=disable'
            --set auth.allowDevToken=true
          )

          helm lint deploy/charts/fuse "${minimal[@]}"
          helm template fuse-dry-run deploy/charts/fuse "${minimal[@]}" >/dev/null

          # Packaged into its OWN directory, never dist/: dist/ belongs to
          # GoReleaser and is globbed by the two steps around this one
          # (fuse_*_darwin_arm64.tar.gz above, fuse_*_checksums.txt below).
          # A stray artifact there is a trap for a future glob widening.
          out="${RUNNER_TEMP}/chart-dry-run"
          rm -rf "${out}" && mkdir -p "${out}"

          helm package deploy/charts/fuse \
            --version 0.0.0-dev --app-version 0.0.0-dev \
            --destination "${out}"

          chart="${out}/fuse-0.0.0-dev.tgz"
          [ -f "${chart}" ] || {
            echo "::error::expected ${chart} after 'helm package' — not found. release.yml's publish step asserts the same <name>-<version>.tgz shape, so this is a real break." >&2
            ls -la "${out}" >&2
            exit 1
          }
          echo "ok: packaged ${chart}"

      # `config` parses, merges the `include:`d observability stack, and
      # interpolates — the whole of what a broken compose file gets wrong —
      # without pulling an image or starting a container. Bring-up stays an
      # operator-only smoke (`make compose-smoke`).
      #
      # The stack uses `include:`, which needs Compose v2.20+. ubuntu-latest
      # ships well past that, and `docker compose version` is printed first so a
      # future runner-image regression names the version in the log instead of
      # surfacing as an inscrutable parse error. No guard beyond that: an absent
      # compose fails here under `set -e`, which is this job's posture.
      - name: Validate the compose stack
        run: |
          set -euo pipefail
          docker compose version
          docker compose -f deploy/compose/docker-compose.yml config >/dev/null
          echo "ok: deploy/compose/docker-compose.yml"

      # Drive the real installer against the snapshot tree over
      # FUSE_RELEASE_BASE_URL. The test takes the dist dir as $1 and recovers the
      # generated snapshot version from the single fuse_*_checksums.txt, so no
      # version string has to be threaded through this workflow. It installs into
      # its own temp dirs and never touches the runner's $HOME/.local/bin.
      - name: Exercise scripts/install.sh against the snapshot dist/
        run: scripts/install_test.sh "${GITHUB_WORKSPACE}/dist"

  mcp-integration:
    runs-on: ubuntu-latest
    # Cap runaway jobs: normal runtime is 2-12 minutes; the 360-minute default
    # let a transient apt-mirror hang burn ~6h per job (2026-08-19 incident).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Playwright browsers
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium

      - name: Start MCP services
        run: docker compose -f internal/mcp/testdata/docker-compose.yml up -d

      - name: Wait for services
        run: |
          set -e
          wait_for() {
            local url="$1"
            for i in $(seq 1 90); do
              # --max-time 3: prevents curl from hanging on SSE/streaming
              # endpoints that never close the connection.
              # "; true" suppresses set -e on curl's timeout exit (28) while
              # preserving the HTTP status code curl writes to stdout before
              # timing out — so SSE endpoints that return 200 headers but
              # stream forever are correctly detected as ready.
              code=$(curl -s --max-time 3 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null; true)
              if [[ "${code}" -ge 200 && "${code}" -lt 500 ]] 2>/dev/null; then
                echo "ready: $url (HTTP ${code})"
                return 0
              fi
              sleep 2
            done
            echo "timed out waiting for $url" >&2
            return 1
          }
          wait_for http://localhost:8080/default/.well-known/openid-configuration
          wait_for http://localhost:3001/sse

      - name: Run integration tests
        run: go test -tags integration -v -timeout 300s ./internal/mcp/...

      - name: Service logs on failure
        if: failure()
        run: docker compose -f internal/mcp/testdata/docker-compose.yml logs

      - name: Teardown
        if: always()
        run: docker compose -f internal/mcp/testdata/docker-compose.yml down -v
