name: Integration

on: [push, pull_request]

jobs:
  mcp-integration:
    runs-on: ubuntu-latest
    env:
      # The pinned playwright-go's default driver CDN (playwright.azureedge.net)
      # was retired; the live Microsoft CDN still serves this driver version.
      PLAYWRIGHT_DOWNLOAD_HOST: https://playwright.download.prss.microsoft.com/dbazure/download/playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Playwright browsers
        run: go run github.com/playwright-community/playwright-go/cmd/playwright install --with-deps chromium

      - name: Start MCP services
        run: docker compose -f internal/mcp/testdata/docker-compose.yml up -d

      - name: Wait for services
        run: |
          set -e
          wait_for() {
            local url="$1"
            for i in $(seq 1 90); do
              if curl -sf -o /dev/null "$url"; then
                echo "ready: $url"
                return 0
              fi
              sleep 2
            done
            echo "timed out waiting for $url" >&2
            return 1
          }
          wait_for http://localhost:8080/default/.well-known/openid-configuration
          wait_for http://localhost:3001/sse

      - name: Run integration tests
        run: go test -tags integration -v -timeout 300s ./internal/mcp/...

      - name: Service logs on failure
        if: failure()
        run: docker compose -f internal/mcp/testdata/docker-compose.yml logs

      - name: Teardown
        if: always()
        run: docker compose -f internal/mcp/testdata/docker-compose.yml down -v
