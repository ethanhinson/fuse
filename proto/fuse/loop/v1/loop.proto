syntax = "proto3";

// Package fuse.loop.v1 is the IDL-defined loop.* wire for the networked binding
// (change 0055), successor to the JSON-over-WebSocket wire (#48, ADR-0032
// superseded). It exposes loop control — StartLoop / Send (unary) and Observe
// (server-streaming history-then-live) — as a Connect service so a browser can
// reach it over HTTP/2 with no proxy. Tenant is a typed, pass-through request
// field (identity enforcement is #0049). The per-kind payload shapes are NOT
// re-modeled here: payload stays raw JSON bytes (#50 owns SDK ergonomics), and
// kind stays a string to avoid lock-stepping a proto enum with internal/event.Kind.
// GetCapabilities is the read-only discovery call: it tells a client which models,
// skills, tighten-only ceilings, secret names and spec MCP auth types the server
// will accept before it composes a HarnessSpec.
package fuse.loop.v1;

import "fuse/harness/v1/harness.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ethanhinson/fuse/internal/loopwire/v1;loopv1";

// LoopService is the networked loop-control surface. Unary + server-streaming only
// (no bidi): Observe(from_seq) subsumes both live tail and Attach/HTTP-replay
// catch-up, so a reconnecting client re-opens Observe from its last-seen seq.
service LoopService {
  // StartLoop constructs and drives one agent loop, returning its loop_id.
  rpc StartLoop(StartLoopRequest) returns (StartLoopResponse);
  // Send injects human input at the loop's next turn boundary.
  rpc Send(SendRequest) returns (SendResponse);
  // Observe streams history since from_seq then live events; a reconnecting client
  // re-opens it from its last-seen seq (the WS-era Attach/HTTP-replay role).
  rpc Observe(ObserveRequest) returns (stream ObserveEvent);
  // GetCapabilities advertises what this server accepts in a StartLoop harness
  // spec: models, skills, tighten-only ceilings, the caller's resolvable secret
  // names and the MCP auth types a spec-declared server may use. Read-only; it
  // starts no loop. Same auth as StartLoop. A server with no capability source
  // answers Unimplemented rather than an empty but plausible answer.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

message StartLoopRequest {
  string task = 1;
  string model = 2;
  string tenant = 3;
  bool interactive = 4;
  // orchestrate_loop_id, when set, starts this loop as the orchestrator of that other
  // loop (same tenant): a persistent chat loop whose only tools watch and steer the
  // target. Chat with it through Send and Observe like any interactive loop. It implies
  // interactive; model picks the orchestrator's own model.
  string orchestrate_loop_id = 5;
  // harness, when set, is the harness this loop runs (change 0085): the server
  // layers it over its own trusted config, which stays the floor - fields marked
  // tighten_only may only tighten the server's values, and operator-only surfaces
  // always come from the server. An invalid spec fails with InvalidArgument whose
  // single detail is a fuse.harness.v1.ValidateHarnessResponse listing every
  // violation, and no loop is created. Unset: the server's config, as before.
  fuse.harness.v1.HarnessSpec harness = 6;
}

message StartLoopResponse {
  string loop_id = 1;
  // harness_digest acknowledges the request's harness (change 0085): the content
  // digest of the spec the loop runs and recorded (sha256 of its deterministic
  // encoding, as harness.Digest computes it). Empty when the request carried no
  // spec. A client that sent a spec and gets no digest back is talking to a server
  // that predates harness specs and ran the loop on its own config instead.
  string harness_digest = 2;
}

message SendRequest {
  string loop_id = 1;
  string input = 2;
  string tenant = 3;
  // interrupt cancels the loop's in-flight model call or tool batch so this message
  // lands now instead of at the next turn boundary (steering). Servers whose runtime
  // cannot interrupt deliver it at the next boundary like any other message.
  bool interrupt = 4;
  // source labels who is speaking: "human" (the default) or "orchestrator". The agent
  // sees guidance from an orchestrator under its own label. Any other value is
  // rejected. The label is informational, not a credential: a client can already put
  // any text in a message.
  string source = 5;
}

message SendResponse {}

message ObserveRequest {
  string loop_id = 1;
  uint64 from_seq = 2;
  string tenant = 3;
}

// ObserveEvent carries either a domain event or a keepalive/gap marker frame.
message ObserveEvent {
  Event event = 1;    // unset on a bare keepalive
  bool gap = 2;       // true when a sequence gap preceded this event (re-observe hint)
  bool keepalive = 3; // true on an idle heartbeat frame (no event); survives idle timeout
}

// Event mirrors internal/event.Event at the transport edge. payload is raw JSON
// (the existing json.RawMessage); kind is a string discriminant.
message Event {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  string node_id = 3;
  string parent_id = 4;
  int32 depth = 5;
  int32 turn = 6;
  string kind = 7;
  bytes payload = 8;
}

message GetCapabilitiesRequest {
  // Same pass-through as StartLoopRequest.tenant: when set it must equal the
  // authenticated tenant (else PermissionDenied). The answer is always filtered
  // by the authenticated tenant, never by this field.
  string tenant = 1;
}

message GetCapabilitiesResponse {
  // Models a server-mode loop can run, by alias. cli/ routes and entries the
  // operator hid (advertise: false) are left out.
  repeated ModelInfo models = 1;
  // Skills a spec's skills[].name may reference.
  repeated SkillInfo skills = 2;
  // One per tighten-only HarnessSpec field; for a field under a map
  // (workflows), one per key the operator defines.
  repeated Ceiling ceilings = 3;
  // Secret names that resolve for the caller's tenant: names only. A name the
  // operator restricted to hosts is still listed, and still resolves only for
  // those hosts.
  repeated string secret_refs = 4;
  // Auth types a spec-declared MCP server may use; UNSPECIFIED means none.
  repeated fuse.harness.v1.McpAuthType spec_mcp_auth_kinds = 5;
  ServerInfo server = 6;
}

message ModelInfo {
  string alias = 1;
  string gateway_id = 2;
  // Effective output cap: the server's top-level max_tokens when the registry
  // entry sets 0. 0 only when neither the entry nor the server sets a cap.
  uint32 max_output_tokens = 3;
  // Effective window: the runtime default when the registry entry sets 0,
  // with context_window_is_default set.
  uint32 context_window = 4;
  bool context_window_is_default = 5;
  string persona = 6;
  bool is_default = 7;
  // Optional operator metadata. Well-known tags: tools, vision, reasoning,
  // long-context; other strings pass through.
  string label = 8;
  string description = 9;
  repeated string tags = 10;
}

message SkillInfo {
  string name = 1;
  string description = 2;
}

// Ceilings are strict: a spec value equal to the ceiling's value is refused.
enum CeilingDirection {
  CEILING_DIRECTION_UNSPECIFIED = 0;
  // A spec value must be strictly below the ceiling's value; equal is refused.
  CEILING_DIRECTION_MAX = 1;
  // A spec value must be strictly above the ceiling's value; equal is refused.
  CEILING_DIRECTION_MIN = 2;
}

// The operator limit one tighten-only spec field is held to. The limit is
// strict: a spec value equal to value is refused, not accepted.
message Ceiling {
  // fuse.harness.v1.Violation.field_path vocabulary.
  string field_path = 1;
  // false: the operator left it unset, so a spec cannot set it at all.
  bool operator_set = 2;
  // The operator's effective value; present only when operator_set.
  google.protobuf.Value value = 3;
  CeilingDirection direction = 4;
}

message ServerInfo {
  string version = 1;
  // Algorithm id StartLoopResponse.harness_digest is prefixed with ("sha256").
  string digest_algorithm = 2;
}
