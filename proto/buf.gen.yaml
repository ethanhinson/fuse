version: v2
plugins:
  # Go message stubs, module-relative via go_package: fuse.loop.v1 → internal/loopwire/v1,
  # fuse.harness.v1 → harness/v1 (public: importable from other Go modules, ADR-0060).
  - local: protoc-gen-go
    out: ../
    opt:
      - module=github.com/ethanhinson/fuse
  # connect-go service stubs → alongside the Go message stubs.
  - local: protoc-gen-connect-go
    out: ../
    opt:
      - module=github.com/ethanhinson/fuse
  # connect-es v2 TS stubs (messages + service descriptors) → proto/gen/ts.
  # In connect-es v2 the Connect client is created at runtime from these descriptors
  # (@connectrpc/connect createClient), so protoc-gen-es alone is sufficient.
  - local: ["npx", "protoc-gen-es"]
    out: gen/ts
    opt:
      - target=ts
      - import_extension=js
      # fuse.harness.v1 imports buf/validate/validate.proto (protovalidate, a buf
      # dependency). Its TS descriptors ship in the @bufbuild/protovalidate npm
      # package, so point the import there instead of generating a local copy.
      - rewrite_imports=./buf/validate/**/*_pb.js:@bufbuild/protovalidate/gen
